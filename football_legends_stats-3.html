<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Legends — Player Stats</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#06111f,#0b1d32 55%,#07101b);
  color:#fff;min-height:100vh;
}
header{
  padding:42px 20px 30px;text-align:center;
  background:radial-gradient(circle at 50% 0%,#183b62 0%,transparent 55%);
}
.badge{display:inline-block;background:#1d9bf0;padding:7px 14px;border-radius:30px;font-size:12px;font-weight:bold;letter-spacing:1px}
h1{font-size:clamp(34px,6vw,64px);margin:15px 0 8px}
.subtitle{color:#a9bdd2;margin:0 auto;max-width:650px;font-size:16px}
.controls{max-width:1100px;margin:15px auto 30px;padding:0 20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
input,select{
  background:#101f31;color:#fff;border:1px solid #29445e;border-radius:12px;
  padding:13px 16px;font-size:15px;outline:none
}
input{width:min(420px,90vw)}
.grid{
  max-width:1200px;margin:auto;padding:0 20px 50px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px
}
.card{
  background:linear-gradient(180deg,#12263b,#0d1b2b);
  border:1px solid #25445f;border-radius:22px;overflow:hidden;
  box-shadow:0 15px 40px #0005;transition:.25s;position:relative
}
.card:hover{transform:translateY(-7px);border-color:#39a9ff}
.photo{height:265px;background:#10283d;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center top}
.info{padding:19px}
.name{font-size:24px;font-weight:800;margin:0 0 5px}
.meta{color:#91aac1;font-size:13px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#0a1624;border-radius:12px;padding:10px 5px;text-align:center}
.stat b{display:block;font-size:18px;color:#fff}.stat span{font-size:10px;color:#7790a7;text-transform:uppercase}
footer{text-align:center;color:#71879c;padding:25px}
.no-results{text-align:center;grid-column:1/-1;color:#9ab0c4;padding:40px}
</style>
</head>
<body>
<header>
  <span class="badge">⚽ FOOTBALL STATS</span>
  <h1>Football Legends</h1>
  <p class="subtitle">Explore famous footballers, their clubs, positions and key career statistics.</p>
</header>

<div class="controls">
  <input id="search" type="search" placeholder="Search a player...">
  <select id="position">
    <option value="all">All positions</option>
    <option value="Forward">Forward</option>
    <option value="Midfielder">Midfielder</option>
  </select>
</div>

<main class="grid" id="players"></main>
<footer>Stats shown are selected career highlights. Player figures can change as careers continue.</footer>

<script>
const players = [
 {name:"Lionel Messi",country:"Argentina 🇦🇷",club:"Inter Miami",position:"Forward",goals:"850+",assists:"380+",apps:"1,100+",photo:"https://commons.wikimedia.org/wiki/Special:FilePath/Lionel%20Messi%202022.jpg"},
 {name:"Cristiano Ronaldo",country:"Portugal 🇵🇹",club:"Al Nassr",position:"Forward",goals:"950+",assists:"280+",apps:"1,300+",photo:"https://commons.wikimedia.org/wiki/Special:FilePath/Cristiano%20Ronaldo%202018.jpg"},
 {name:"Neymar Jr.",country:"Brazil 🇧🇷",club:"Santos",position:"Forward",goals:"450+",assists:"270+",apps:"750+",photo:"https://commons.wikimedia.org/wiki/Special:FilePath/Neymar%202018.jpg"},
 {name:"Kylian Mbappé",country:"France 🇫🇷",club:"Real Madrid",position:"Forward",goals:"400+",assists:"170+",apps:"500+",photo:"https://commons.wikimedia.org/wiki/Special:FilePath/Kylian%20Mbappe%202019.jpg"},
 {name:"Erling Haaland",country:"Norway 🇳🇴",club:"Manchester City",position:"Forward",goals:"300+",assists:"70+",apps:"380+",photo:"https://commons.wikimedia.org/wiki/Special:FilePath/Erling%20Haaland%202022.jpg"},
 {name:"Mohamed Salah",country:"Egypt 🇪🇬",club:"Liverpool",position:"Forward",goals:"350+",assists:"180+",apps:"650+",photo:"https://commons.wikimedia.org/wiki/Special:FilePath/Mohamed%20Salah%202018.jpg"},
 {name:"Kevin De Bruyne",country:"Belgium 🇧🇪",club:"Napoli",position:"Midfielder",goals:"170+",assists:"280+",apps:"650+",photo:"https://commons.wikimedia.org/wiki/Special:FilePath/Kevin%20De%20Bruyne%202021.jpg"},
 {name:"Vinícius Júnior",country:"Brazil 🇧🇷",club:"Real Madrid",position:"Forward",goals:"150+",assists:"100+",apps:"350+",photo:"https://commons.wikimedia.org/wiki/Special:FilePath/Vinicius%20Junior%202022.jpg"}
];

const grid=document.getElementById("players"), search=document.getElementById("search"), position=document.getElementById("position");

function render(){
 const q=search.value.toLowerCase().trim(), p=position.value;
 const list=players.filter(x=>(x.name.toLowerCase().includes(q)||x.club.toLowerCase().includes(q))&&(p==="all"||x.position===p));
 grid.innerHTML=list.length?list.map(x=>`
 <article class="card">
   <div class="photo"><img src="${x.photo}" alt="${x.name}" loading="lazy" onerror="this.style.display='none'"></div>
   <div class="info">
     <h2 class="name">${x.name}</h2>
     <div class="meta">${x.country} · ${x.club} · ${x.position}</div>
     <div class="stats">
       <div class="stat"><b>${x.goals}</b><span>Goals</span></div>
       <div class="stat"><b>${x.assists}</b><span>Assists</span></div>
       <div class="stat"><b>${x.apps}</b><span>Apps</span></div>
     </div>
   </div>
 </article>`).join(""):'<div class="no-results">No player found.</div>';
}
search.addEventListener("input",render); position.addEventListener("change",render); render();
</script>
</body>
</html>
